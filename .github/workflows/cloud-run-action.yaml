name: cloud-run-action.yaml
on:
  push:
    branches:
        - main
        - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Cloud Run Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Nos autenticamos con Google Cloud
      - name: Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      # Configuramos el SDK de Google Cloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      # Configuramos Docker para construir las imagenes
      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-east1-docker.pkg.dev
      # Construimos la imagen docker de la aplicación
      - name: Build
        run: |
          docker build -t us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/docker-images-samples/consumer-messaging:latest .
      # Subimos la imagen docker al artifact registry de Google Cloud
      - name: Push
        run: |
          docker push us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/docker-images-samples/consumer-messaging:latest
      # Desplegamos la aplicación en Cloud Run
      - name: Deploy
        run: |
          gcloud run deploy consumer-messaging \
            --region us-east1 \
            --image us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/docker-images-samples/consumer-messaging:latest \
            --platform managed \
            --allow-unauthenticated
            --max-instances 1 \
            --min-instances 1 \
            --no-cpu-throttling \
            --project ${{ secrets.GCP_PROJECT_ID }}